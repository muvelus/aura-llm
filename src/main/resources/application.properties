# LLM Provider Configuration
# Switch the active LLM by changing this one value (minor change, no code edit):
#   ollama-gemma4-31b-cloud  -> local Ollama (default; existing behavior, unchanged)
#   bedrock                  -> Amazon Bedrock Converse API with Claude Sonnet 4.6 (structured JSON)
# It can also be switched at RUNTIME without redeploying:
#   POST /api/provider?name=bedrock     (and GET /api/provider shows the current one)
llm.provider=ollama-gemma4-31b-cloud

# Amazon Bedrock configuration (only used when the active provider is bedrock).
# Claude Sonnet 4.6 on Bedrock is served via a cross-region inference profile,
# hence the regional prefix; change to eu./apac. (or a bare anthropic.* id) as needed.
bedrock.region=us-east-1
bedrock.model.id=us.anthropic.claude-sonnet-4-6
bedrock.max.tokens=2000

